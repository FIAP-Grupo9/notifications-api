name: CI/CD

on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NotificationsAPI.sln

      - name: Build
        run: dotnet build NotificationsAPI.sln --no-restore --configuration Release

      # Ainda nao ha projeto de testes neste servico — a etapa de teste entra
      # aqui quando ele existir (ver users-api/payments-api para o padrao).

  build-and-push-image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem
        run: echo "IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/notifications-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login no ACR (via credencial do Service Principal)
        run: az acr login --name $(echo '${{ secrets.ACR_LOGIN_SERVER }}' | cut -d. -f1)

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy no AKS (rolling update)
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Apontar kubectl para o AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Aplicar ConfigMap e Secret
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

      - name: Aplicar Deployment com a imagem recém-publicada e Service
        env:
          IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/notifications-api:${{ github.sha }}
        run: |
          sed -e "s#image: fcg-notifications-api:latest#image: ${IMAGE}#" \
              -e "s#imagePullPolicy: IfNotPresent#imagePullPolicy: Always#" \
              k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Aguardar rollout (sem downtime)
        run: kubectl rollout status deployment/notifications-api -n fcg --timeout=180s
